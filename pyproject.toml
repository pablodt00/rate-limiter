[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rate-limiter"
version = "0.0.0"
description = "A rate limiter library with pluggable algorithms, backends, and server/client."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
redis = ["redis>=4.2"]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "redis>=4.2",
    "fakeredis[lua]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rate_limiter"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = [
    "integration: needs a real Redis; set RATE_LIMITER_REDIS_URL to run (skipped otherwise)",
]
