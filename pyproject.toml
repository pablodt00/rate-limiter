[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-ratelimit-kit"
version = "0.1.0"
description = "A rate limiter library with pluggable algorithms, backends, and server/client."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["rate-limit", "rate-limiting", "throttling", "fastapi", "redis", "backoff"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/pablodt00/rate-limiter"
Issues = "https://github.com/pablodt00/rate-limiter/issues"

[project.optional-dependencies]
redis = ["redis>=4.2"]
fastapi = ["fastapi>=0.100"]
httpx = ["httpx>=0.24"]
requests = ["requests>=2.28"]
all = [
    "redis>=4.2",
    "fastapi>=0.100",
    "httpx>=0.24",
    "requests>=2.28",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "redis>=4.2",
    "fakeredis[lua]>=2.10",
    "fastapi>=0.100",
    "httpx>=0.24",
    "requests>=2.28",
    "uvicorn",
    "types-requests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rate_limiter"]

[tool.ruff]
src = ["src", "tests", "."]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
markers = [
    "integration: needs a real Redis; set RATE_LIMITER_REDIS_URL to run (skipped otherwise)",
]
